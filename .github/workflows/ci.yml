name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Tests mock the LLM provider and MCP — no OPENROUTER_API_KEY needed.
      # test:coverage runs the full suite AND enforces the non-regression
      # coverage thresholds in vitest.config.ts (fails if coverage drops).
      - run: npm run test:coverage
      - run: npm run build
